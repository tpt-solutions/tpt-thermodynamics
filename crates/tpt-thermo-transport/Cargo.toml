[package]
name = "tpt-thermo-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport properties (viscosity, thermal conductivity, diffusivity) for tpt-thermodynamics — gas-phase correlations (Chung, Fuller-Schettler-Giddings, Wilke mixing) and liquid correlations (Lucas, Ely-Hanley)."

[dependencies]
tpt-thermo-core = { path = "../tpt-thermo-core" }
tpt-thermo-data = { path = "../tpt-thermo-data" }
tpt-math-units = { workspace = true, default-features = false, features = ["alloc"] }
uom = { workspace = true, default-features = false, features = ["si", "f32", "f64", "autoconvert"] }

[features]
default = ["std"]
std = []
alloc = []

[lib]
path = "src/lib.rs"

[lints]
workspace = true

# factor omega, and the molar mass (kg/mol), sourced from the NIST Chemistry
# WebBook / Poling, Prausnitz & O'Connell, "The Properties of Gases and Liquids"
# (5th ed., 2001). This is a *seed* set (~58 compounds, expanded from the
# original ~24 in Phase 3); the full 2000+ dataset is tracked as Deferred Scope
# in todo.md.


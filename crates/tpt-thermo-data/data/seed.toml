# --- Binary interaction parameters (k_ij) -----------------------------------
# Curated PR/SRK binary interaction parameters for common pairs, sourced from
# Poling, Prausnitz & O'Connell (2001), ch. 8, and the NIST/TRC VLE tables.
# Values are dimensionless and symmetric; the BipTable defaults every other pair
# to 0.0. These are consumed opt-in by the cubic crate's `from_database_with_kij`
# constructor.


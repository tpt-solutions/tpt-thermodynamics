# Curated seed component dataset for tpt-thermodynamics.
#
# Values are critical constants (Tc in K, Pc in Pa), the Pitzer acentric
# factor omega, and the molar mass (kg/mol), sourced from the NIST Chemistry
# WebBook / Poling, Prausnitz & O'Connell, "The Properties of Gases and Liquids"
# (5th ed., 2001). This is a *seed* set (~24 compounds); the full 2000+ dataset
# is tracked as Deferred Scope in todo.md.

[[components]]
schema_version = 1
name = "water"
formula = "H2O"
cas = "7732-18-5"
critical_temperature_k = 647.096
critical_pressure_pa = 22064000.0
acentric_factor = 0.344
molar_mass_kg_per_mol = 0.01801528
normal_boiling_point_k = 373.15
source = "NIST / Poling et al. 2001"


[package]
name = "tpt-thermo-electrolyte"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Electrolyte thermodynamics for tpt-thermodynamics — Pitzer, eNRTL, HKF, ion association and gas solubility."

[dependencies]
tpt-thermo-core = { path = "../tpt-thermo-core" }
tpt-thermo-data = { path = "../tpt-thermo-data" }
tpt-thermo-eos-activity = { path = "../tpt-thermo-eos-activity" }
tpt-math-units = { workspace = true, default-features = false, features = ["alloc"] }
uom = { workspace = true, default-features = false, features = ["si", "f32", "f64", "autoconvert"] }

[features]
default = ["std"]
std = []
alloc = []

[lib]
path = "src/lib.rs"

[lints]
workspace = true
